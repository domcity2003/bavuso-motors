<text x="24" y="34" font-size="22" fill="#1f2937" text-anchor="start" font-weight="700">Bavuso V1: HV single-line diagram (one line stands for the + / - pair)</text>
<text x="24" y="56" font-size="13" fill="#4b5563" text-anchor="start">Pack 100s11p, 360 V nominal (420 V max), 23.8 kWh. EMRAX 228 LV+43% on a Cascadia CM200DX. Native NACS inlet, DC and AC. All HV parts in one sealed box.</text>
<rect x="20" y="300" width="210" height="170" rx="6" fill="#fff1e6" stroke="#c2410c" stroke-width="2"/>
