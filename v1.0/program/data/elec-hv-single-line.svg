<text x="125.0" y="373.0" font-size="11" fill="#4b5563" text-anchor="middle">100s11p, 1,100 x P60B</text>
<text x="125.0" y="389.0" font-size="11" fill="#4b5563" text-anchor="middle">10 modules of 10s11p (36 V each)</text>
<text x="125.0" y="405.0" font-size="11" fill="#4b5563" text-anchor="middle">per-cell Al fuse wire (0.4 mm)</text>
<text x="125.0" y="421.0" font-size="11" fill="#4b5563" text-anchor="middle">23.8 kWh, 250-420 V</text>
