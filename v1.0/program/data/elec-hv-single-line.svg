<text x="780" y="722" font-size="11" fill="#4b5563" text-anchor="start">measures HV+ and HV- to chassis; paused during</text>
<text x="780" y="736" font-size="11" fill="#4b5563" text-anchor="start">the station's CableCheck insulation test</text>
<polyline points="40,760 1480,760" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" stroke-linejoin="round"/>
<text x="24" y="750" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="700">HVIL loop (20 mA PWM): MSD > pack lid connector > HV box lid > inverter > OBC > DC-DC > heater > back to VCU. Open loop = contactors open, no pyro.</text>
<rect x="1090" y="520" width="380" height="150" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text x="1280.0" y="559.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="700">Protection and control (VCU + BMS)</text>
<text x="1280.0" y="575.0" font-size="11" fill="#4b5563" text-anchor="middle">Fires pyro F1: >650 A for 20 ms, >480 A for 40 s, crash flag, hard fault</text>
<text x="1280.0" y="591.0" font-size="11" fill="#4b5563" text-anchor="middle">Opens K1-K5 below 350 A only (GX14 350 A carry)</text>
<text x="1280.0" y="607.0" font-size="11" fill="#4b5563" text-anchor="middle">DC current cap 350 A, charge cap 137 A (12.5 A per cell)</text>
<text x="1280.0" y="623.0" font-size="11" fill="#4b5563" text-anchor="middle">Precharge: K3 until bus is within 21 V, abort at 0.5 s</text>
<text x="1280.0" y="639.0" font-size="11" fill="#4b5563" text-anchor="middle">Weld check of K4/K5 through shunt U3 before the inlet unlocks</text>
<text x="1090" y="700" font-size="12" fill="#4b5563" text-anchor="start">Short circuit 3.4 to 6.2 kA (calculated); fuse and pyro break 20+ kA</text>
<text x="24" y="785" font-size="12" fill="#6b7280" text-anchor="start">Legend: orange = HV (shielded, orange sleeve); red = 12 V; blue = BMS; green = charge inlet. K = GX14 contactor; F = fuse.</text>
